<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Dados</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/morador/dashboard}">
            Sistema de Encomendas
        </a>

        <form method="post" th:action="@{/logout}">
            <button class="btn btn-outline-light" type="submit">
                Sair
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4">Meus Dados</h1>

                    <div class="alert alert-success"
                         th:if="${param.sucesso}">
                        Dados atualizados com sucesso.
                    </div>

                    <div class="alert alert-danger"
                         th:if="${erro}"
                         th:text="${erro}">
                    </div>

                    <form method="post"
                          th:action="@{/morador/meus-dados}"
                          th:object="${morador}">

                        <div class="mb-3">
                            <label class="form-label" for="nome">
                                Nome
                            </label>

                            <input class="form-control"
                                   id="nome"
                                   th:field="*{nome}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="telefone">
                                Telefone
                            </label>

                            <input class="form-control"
                                   id="telefone"
                                   th:field="*{telefone}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">
                                E-mail
                            </label>

                            <input class="form-control"
                                   type="email"
                                   id="email"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Apartamento ou casa
                            </label>

                            <input class="form-control"
                                   th:value="${morador.apartamento}"
                                   disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Login
                            </label>

                            <input class="form-control"
                                   th:value="${morador.login}"
                                   disabled>
                        </div>

                        <div class="alert alert-secondary">
                            Apartamento e login só podem ser alterados pela portaria.
                        </div>

                        <div class="d-flex gap-2">

                            <button class="btn btn-primary"
                                    type="submit">
                                Salvar alterações
                            </button>

                            <a class="btn btn-outline-secondary"
                               th:href="@{/morador/dashboard}">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
