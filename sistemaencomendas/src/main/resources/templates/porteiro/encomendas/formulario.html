<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar encomenda</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/porteiro/dashboard}">
            Sistema de Encomendas
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4">Registrar encomenda</h1>

                    <div class="alert alert-danger"
                         th:if="${erro}"
                         th:text="${erro}">
                    </div>

                    <form method="post"
                          th:action="@{/porteiro/encomendas}">

                        <div class="mb-3">
                            <label for="moradorId"
                                   class="form-label">
                                Morador
                            </label>

                            <select id="moradorId"
                                    name="moradorId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Selecione um morador
                                </option>

                                <option th:each="morador : ${moradores}"
                                        th:if="${morador.ativo}"
                                        th:value="${morador.id}"
                                        th:selected="${moradorId != null
                                        and morador.id == moradorId}"
                                        th:text="${morador.nome
                                        + ' - Unidade '
                                        + morador.apartamento}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="descricao"
                                   class="form-label">
                                Descrição da encomenda
                            </label>

                            <textarea id="descricao"
                                      name="descricao"
                                      class="form-control"
                                      rows="4"
                                      maxlength="500"
                                      required
                                      th:text="${descricao}">
                            </textarea>
                        </div>

                        <div class="d-flex gap-2">

                            <button class="btn btn-primary"
                                    type="submit">
                                Salvar
                            </button>

                            <a class="btn btn-outline-secondary"
                               th:href="@{/porteiro/encomendas}">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
