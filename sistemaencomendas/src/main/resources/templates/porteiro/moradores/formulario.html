<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Morador</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/porteiro/dashboard}">
            Sistema de Encomendas
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4"
                        th:text="${edicao} ? 'Editar morador' : 'Cadastrar morador'">
                    </h1>

                    <div class="alert alert-danger"
                         th:if="${erro}"
                         th:text="${erro}">
                    </div>

                    <form method="post"
                          th:action="${edicao}
                              ? @{/porteiro/moradores/{id}(id=${morador.id})}
                              : @{/porteiro/moradores}"
                          th:object="${morador}">

                        <div class="mb-3">
                            <label class="form-label" for="nome">
                                Nome
                            </label>

                            <input class="form-control"
                                   id="nome"
                                   th:field="*{nome}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="apartamento">
                                Apartamento ou casa
                            </label>

                            <input class="form-control"
                                   id="apartamento"
                                   th:field="*{apartamento}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="telefone">
                                Telefone
                            </label>

                            <input class="form-control"
                                   id="telefone"
                                   th:field="*{telefone}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">
                                E-mail
                            </label>

                            <input class="form-control"
                                   type="email"
                                   id="email"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="login">
                                Login
                            </label>

                            <input class="form-control"
                                   id="login"
                                   th:field="*{login}"
                                   required>
                        </div>

                        <div class="form-check mb-3"
                             th:if="${edicao}">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="ativo"
                                   th:field="*{ativo}">

                            <label class="form-check-label"
                                   for="ativo">
                                Morador ativo
                            </label>

                        </div>

                        <div class="d-flex gap-2">

                            <button class="btn btn-primary"
                                    type="submit">
                                Salvar
                            </button>

                            <a class="btn btn-outline-secondary"
                               th:href="@{/porteiro/moradores}">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
