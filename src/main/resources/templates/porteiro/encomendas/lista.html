<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encomendas</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/porteiro/dashboard}">
            Sistema de Encomendas
        </a>

        <form method="post" th:action="@{/logout}">
            <button class="btn btn-outline-light" type="submit">
                Sair
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Encomendas</h1>

        <a class="btn btn-primary"
           th:href="@{/porteiro/encomendas/nova}">
            Registrar encomenda
        </a>
    </div>

    <div class="alert alert-success"
         th:if="${param.sucesso}">
        Encomenda registrada com sucesso.
    </div>

    <div class="alert alert-success"
         th:if="${param.retirada}">
        Retirada registrada com sucesso.
    </div>

    <div class="alert alert-danger"
         th:if="${param.erro}"
         th:text="${param.erro}">
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped align-middle">

                    <thead>
                    <tr>
                        <th>Morador</th>
                        <th>Unidade</th>
                        <th>Descrição</th>
                        <th>Recebimento</th>
                        <th>Retirada</th>
                        <th>Status</th>
                        <th>Notificação</th>
                        <th>Morador ciente?</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="encomenda : ${encomendas}">
                        <td th:text="${encomenda.morador.nome}"></td>

                        <td th:text="${encomenda.morador.apartamento}"></td>

                        <td th:text="${encomenda.descricao}"></td>

                        <td th:text="${#temporals.format(
                                encomenda.dataRecebimento,
                                'dd/MM/yyyy HH:mm'
                        )}">
                        </td>

                        <td th:text="${encomenda.dataRetirada != null
                                ? #temporals.format(
                                    encomenda.dataRetirada,
                                    'dd/MM/yyyy HH:mm'
                                  )
                                : '-'}">
                        </td>

                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:if="${encomenda.status.name()
                                  == 'RECEBIDA_NA_PORTARIA'}">
                                Recebida na portaria
                            </span>

                            <span class="badge bg-success"
                                  th:if="${encomenda.status.name()
                                  == 'ENTREGUE_AO_MORADOR'}">
                                Entregue ao morador
                            </span>
                        </td>

                        <td th:text="${encomenda.statusNotificacao}">
                        </td>

                        <td>
                            <span th:if="${encomenda.moradorCiente}">
                                Sim
                                <small class="text-muted d-block"
                                       th:text="${#temporals.format(
                                            encomenda.dataCiencia,
                                            'dd/MM/yyyy HH:mm'
                                       )}">
                                </small>
                            </span>

                            <span th:unless="${encomenda.moradorCiente}">
                                Não
                            </span>
                        </td>

                        <td>
                            <form method="post"
                                  th:if="${encomenda.status.name()
                                  == 'RECEBIDA_NA_PORTARIA'}"
                                  th:action="@{/porteiro/encomendas/{id}/retirada(
                                  id=${encomenda.id}
                                  )}">

                                <button class="btn btn-sm btn-success"
                                        type="submit">
                                    Registrar retirada
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(encomendas)}">
                        <td colspan="9"
                            class="text-center text-muted">
                            Nenhuma encomenda registrada.
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
