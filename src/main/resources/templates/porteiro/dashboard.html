<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Porteiro</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Sistema de Encomendas</span>

        <form method="post" th:action="@{/logout}">
            <button class="btn btn-outline-light" type="submit">
                Sair
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <h1 class="mb-4">Painel do Porteiro</h1>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Moradores</h5>
                    <p class="card-text">
                        Cadastre e consulte os moradores.
                    </p>
                    <a href="#" class="btn btn-primary">
                        Acessar
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Encomendas</h5>
                    <p class="card-text">
                        Registre e acompanhe as encomendas.
                    </p>
                    <a href="#" class="btn btn-primary">
                        Acessar
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Configurações</h5>
                    <p class="card-text">
                        Configure e-mail e dados da portaria.
                    </p>
                    <a th:href="@{/porteiro/moradores}" class="btn btn-primary">
                        Acessar
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
