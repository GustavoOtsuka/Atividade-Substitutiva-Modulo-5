<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moradores</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/porteiro/dashboard}">
            Sistema de Encomendas
        </a>

        <form method="post" th:action="@{/logout}">
            <button class="btn btn-outline-light" type="submit">
                Sair
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Moradores</h1>

        <a class="btn btn-primary"
           th:href="@{/porteiro/moradores/novo}">
            Cadastrar morador
        </a>
    </div>

    <div class="alert alert-success"
         th:if="${param.sucesso}">
        Morador cadastrado com sucesso. Senha inicial: 123456
    </div>

    <div class="alert alert-success"
         th:if="${param.atualizado}">
        Morador atualizado com sucesso.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped align-middle">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Apartamento</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Login</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="morador : ${moradores}">
                        <td th:text="${morador.nome}"></td>
                        <td th:text="${morador.apartamento}"></td>
                        <td th:text="${morador.telefone}"></td>
                        <td th:text="${morador.email}"></td>
                        <td th:text="${morador.login}"></td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${morador.ativo}">
                                Ativo
                            </span>

                            <span class="badge bg-secondary"
                                  th:unless="${morador.ativo}">
                                Inativo
                            </span>
                        </td>

                        <td>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/porteiro/moradores/{id}/editar(id=${morador.id})}">
                                Editar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(moradores)}">
                        <td colspan="7"
                            class="text-center text-muted">
                            Nenhum morador cadastrado.
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
